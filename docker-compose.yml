services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polls_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-polls_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: polls_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-polls_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polls_reverb
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8080:8080"
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      - app
      - db

volumes:
  pgdata:
